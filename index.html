<section class="how-section" id="how"><div class="section-heading"><div class="eyebrow">THREE EASY STEPS</div><h2>From link to <span class="accent-text">little keepsake.</span></h2><p>No complicated process. Just a few taps and you're there.</p></div>
<div class="steps-path"><article class="step"><div class="step-number">01</div><div class="step-icon"><svg viewBox="0 0 24 24"><path d="M10 13.5 14.5 9M8.5 15.5l-1 1a4 4 0 0 1-5.7-5.7l3-3a4 4 0 0 1 5.7 0m5 0 1-1a4 4 0 0 1 5.7 5.7l-3 3a4 4 0 0 1-5.7 0"/></svg></div><h3>Drop your link</h3><p>Copy a TikTok video link and paste it into TikSave.</p></article><article class="step"><div class="step-number">02</div><div class="step-icon"><svg viewBox="0 0 24 24"><path d="M4 5h16v14H4zM9 9l6 3-6 3z"/></svg></div><h3>Meet your preview</h3><p>We find your video and show a preview before you save.</p></article><article class="step"><div class="step-number">03</div><div class="step-icon"><svg viewBox="0 0 24 24"><path d="M12 3v12m-4-4 4 4 4-4M5 19h14"/></svg></div><h3>Keep your moment</h3><p>Download the video and save it right to your device.</p></article></div></section>
<section class="features-section" id="features"><div class="features-inner"><div class="features-copy"><div class="eyebrow">MADE TO BE EASY</div><h2>Less fuss.<br><span class="accent-text">More moments.</span></h2><p>Just the essentials, wrapped in a thoughtful little experience. No clutter, no complicated steps—just a clean place to start.</p></div><div class="feature-list"><article><div class="feature-icon"><svg viewBox="0 0 24 24"><path d="M4 5h16v14H4zM8 9h8M8 13h5"/></svg></div><div><h3>Simple by design</h3><p>A clean, responsive interface for desktop, tablet, and mobile.</p></div></article><article><div class="feature-icon"><svg viewBox="0 0 24 24"><path d="M12 3 4 7v5c0 4.5 3.4 7.5 8 9 4.6-1.5 8-4.5 8-9V7zM8.5 12l2.3 2.3 4.8-4.8"/></svg></div><div><h3>Preview first</h3><p>See the video thumbnail before you decide to download.</p></div></article><article><div class="feature-icon"><svg viewBox="0 0 24 24"><path d="M12 3v18M3 12h18M5 5l14 14M19 5 5 19"/></svg></div><div><h3>Creator-first</h3><p>Save only content you own or have permission to keep.</p></div></article></div></div></section>
<section class="faq-section" id="faq"><div class="section-heading"><div class="eyebrow">GOOD TO KNOW</div><h2>A few quick <span class="accent-text">answers.</span></h2></div><div class="faq-list"><details><summary>Is TikSave free to use?<span class="faq-plus">+</span></summary><p>TikSave currently doesn't require an account or payment to use. Availability depends on our video processing service.</p></details><details><summary>Do my videos get stored on TikSave?<span class="faq-plus">+</span></summary><p>TikSave doesn't intentionally keep permanent copies of downloaded videos. Video processing is handled by a third-party service, and downloads are streamed to your device.</p></details><details><summary>Can I save any TikTok video?<span class="faq-plus">+</span></summary><p>Some videos may be private, restricted, unavailable, or unsupported. Only download videos you own or have permission to save.</p></details><details><summary>Why isn't my link working?<span class="faq-plus">+</span></summary><p>Check that it's a valid TikTok video link and that the video is public and available. If it still fails, try again later.</p></details></div></section>
